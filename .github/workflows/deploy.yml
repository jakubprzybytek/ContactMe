name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-int
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to int
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set SST secrets
        run: |
          npx sst secret set ContactEmail "$CONTACT_EMAIL" --stage int
          npx sst secret set SenderEmail "$SENDER_EMAIL" --stage int
          npx sst secret set RecaptchaSecretKey "$RECAPTCHA_SECRET_KEY" --stage int
          npx sst secret set RecaptchaSiteKey "$RECAPTCHA_SITE_KEY" --stage int
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Deploy
        run: npx sst deploy --stage int
