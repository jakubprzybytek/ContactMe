name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-int
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to int
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url"));
            core.info(JSON.stringify({ iss: claims.iss, aud: claims.aud, sub: claims.sub }));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Set SST secrets
        run: |
          npx sst secret set ContactEmail "$CONTACT_EMAIL" --stage int
          npx sst secret set SenderEmail "$SENDER_EMAIL" --stage int
          npx sst secret set RecaptchaSecretKey "$RECAPTCHA_SECRET_KEY" --stage int
          npx sst secret set RecaptchaSiteKey "$RECAPTCHA_SITE_KEY" --stage int
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Deploy
        run: npx sst deploy --stage int
