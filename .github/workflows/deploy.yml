name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-int
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to int
    runs-on: ubuntu-latest
    env:
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
      RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Set reCAPTCHA secret
        run: npx sst secret set RecaptchaSecretKey "$RECAPTCHA_SECRET_KEY" --stage int
        env:
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}

      - name: Deploy
        run: npx sst deploy --stage int
